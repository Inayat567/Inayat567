<svg width="1100" height="200" viewBox="0 0 1100 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: innunext.com dark base (#0B0F19) with subtle indigo tint -->
    <linearGradient id="contactBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1428"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#080D1A"/>
    </linearGradient>

    <linearGradient id="contactAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <pattern id="contactGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Container Box -->
  <rect width="1100" height="200" rx="18" fill="url(#contactBg)"/>
  <rect width="1100" height="200" rx="18" fill="url(#contactGrid)"/>
  <rect x="0.5" y="0.5" width="1099" height="199" rx="17.5" stroke="#6366F1" stroke-width="1" stroke-opacity="0.3" fill="none"/>
  <rect x="0" y="0" width="5" height="200" rx="2.5" fill="url(#contactAccent)"/>

  <!-- Title & Subtitle -->
  <text x="44" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC">🤝 Let's Connect &amp; Build</text>
  <rect x="44" y="64" width="220" height="2" fill="#6366F1" opacity="0.6"/>
  <text x="44" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#94A3B8">Hire me on your preferred freelance platform or explore 15 live case studies on my portfolio.</text>

  <!-- 4 Action Cards -->
  <!-- 1: Upwork -->
  <g transform="translate(44, 110)">
    <rect width="240" height="62" rx="10" fill="#0C261E" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="28" cy="31" r="5" fill="#10B981"/>
    <text x="44" y="27" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="1">TOP RATED FREELANCER</text>
    <text x="44" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Upwork (100% JSS)</text>
  </g>

  <!-- 2: Portfolio -->
  <g transform="translate(300, 110)">
    <rect width="240" height="62" rx="10" fill="#0B2338" stroke="#0284C7" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="28" cy="31" r="5" fill="#38BDF8"/>
    <text x="44" y="27" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="1">LIVE CASE STUDIES</text>
    <text x="44" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">innunext.com</text>
  </g>

  <!-- 3: LinkedIn -->
  <g transform="translate(556, 110)">
    <rect width="240" height="62" rx="10" fill="#0C1D38" stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="28" cy="31" r="5" fill="#60A5FA"/>
    <text x="44" y="27" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#60A5FA" letter-spacing="1">PROFESSIONAL</text>
    <text x="44" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">LinkedIn Profile</text>
  </g>

  <!-- 4: Fiverr -->
  <g transform="translate(812, 110)">
    <rect width="244" height="62" rx="10" fill="#0C2E1E" stroke="#1DBF73" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="28" cy="31" r="5" fill="#1DBF73"/>
    <text x="44" y="27" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="1">MARKETPLACE</text>
    <text x="44" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Fiverr Profile</text>
  </g>
</svg>
