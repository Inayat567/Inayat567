<svg width="1100" height="60" viewBox="0 0 1100 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F19" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Center ambient glow -->
  <circle cx="550" cy="30" r="45" fill="url(#centerGlow)"/>

  <!-- Main beam line -->
  <rect x="0" y="29" width="1100" height="2" fill="url(#beamGrad)"/>

  <!-- Left circuit accent -->
  <g opacity="0.6" stroke="#38BDF8" stroke-width="1.2" fill="none">
    <path d="M 360 30 L 410 30 L 420 20 L 445 20"/>
    <path d="M 390 30 L 405 40 L 435 40"/>
  </g>
  <circle cx="445" cy="20" r="2" fill="#38BDF8"/>
  <circle cx="435" cy="40" r="2" fill="#10B981"/>

  <!-- Right circuit accent -->
  <g opacity="0.6" stroke="#818CF8" stroke-width="1.2" fill="none">
    <path d="M 740 30 L 690 30 L 680 20 L 655 20"/>
    <path d="M 710 30 L 695 40 L 665 40"/>
  </g>
  <circle cx="655" cy="20" r="2" fill="#818CF8"/>
  <circle cx="665" cy="40" r="2" fill="#10B981"/>

  <!-- Outer diamonds -->
  <rect x="510" y="20" width="8" height="8" rx="1.5" fill="#38BDF8" opacity="0.8" transform="rotate(45 514 24)"/>
  <rect x="582" y="20" width="8" height="8" rx="1.5" fill="#818CF8" opacity="0.8" transform="rotate(45 586 24)"/>

  <!-- Center diamond -->
  <g transform="translate(550 30)">
    <rect x="-10" y="-10" width="20" height="20" rx="3.5" fill="url(#diamondGrad)" transform="rotate(45)"/>
    <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#ffffff" opacity="0.95" transform="rotate(45)"/>
  </g>
</svg>
